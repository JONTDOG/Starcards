services:
  starcards:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8501"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./runs:/app/runs

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - starcards
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
