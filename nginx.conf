worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 200m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream starcards_upstream {
    server starcards:8501;
  }

  server {
    listen 80;
    server_name starcards.example.com www.starcards.example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name starcards.example.com www.starcards.example.com;

    ssl_certificate /etc/letsencrypt/live/starcards.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starcards.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
      proxy_pass http://starcards_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_buffering off;
    }
  }
}
